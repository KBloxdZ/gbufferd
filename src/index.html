<!doctype html>
<!-- GBufferd by KBloxdZ, MIT license, https://github.com/KBloxdZ/gbufferd -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GBufferd: Iris shader packs in your browser</title>
  <meta name="description" content="Drop an Iris shader pack zip on the page and it runs in your browser with WebGPU. Frame inspector and GLSL pixel debugger included.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GBufferd">
  <meta property="og:title" content="GBufferd: Iris shader packs in your browser">
  <meta property="og:description" content="Drop a shader pack zip on the page and it runs with WebGPU. No install. Frame inspector and GLSL pixel debugger included.">
  <meta property="og:url" content="https://kbloxdz.github.io/gbufferd/">
  <meta property="og:image" content="https://kbloxdz.github.io/gbufferd/social.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#15171a">
  <style>@@text:src/page.css@@</style>
</head>
<body>
  <canvas id="gl" aria-label="GBufferd" tabindex="0"></canvas>
  <div id="crosshair" aria-hidden="true"></div>
  <div id="testBadge" title="Klick: Panel ein/aus"><span id="testDot" class="dot"></span><span id="testText"></span></div>
  <section id="shaderSettings" hidden aria-label="Shader Settings"></section>

  <script>@@text:src/host-api.js@@</script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>@@text:src/glsl-preprocessor.js@@</script>
  <script>@@concat:src/engine@@</script>
<script>
(()=>{
@@concat:src/viewer@@})();

</script>
<script type="application/json" id="webgpu-third-party-notices">@@text:vendor/third-party-notices.json@@</script>
</body>
</html>
